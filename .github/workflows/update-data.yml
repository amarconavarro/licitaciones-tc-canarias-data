name: Carga inicial JAE 2026
on:
  workflow_dispatch:
  push:
    branches: [datos/jae-2026-inicial]
    paths: ['.github/workflows/update-data.yml']
permissions:
  contents: read
concurrency:
  group: carga-inicial-jae-2026
  cancel-in-progress: false
jobs:
  mes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        mes: ['01','02','03','04','05','06','07','08','09','10','11']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python scripts/carga_jae_2026.py "${{ matrix.mes }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mes-${{ matrix.mes }}
          path: fragmentos/*.json
          if-no-files-found: error
          retention-days: 3
  consolidar:
    needs: mes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: mes-*
          path: fragmentos
          merge-multiple: true
      - run: python scripts/carga_jae_2026.py merge
      - uses: actions/upload-artifact@v4
        with:
          name: jae-2026-json-y-validacion
          path: salida/
          retention-days: 30
          if-no-files-found: error

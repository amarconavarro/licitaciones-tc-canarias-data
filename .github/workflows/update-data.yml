name: Ensayo noviembre ATOM
on:
  workflow_dispatch:
  push:
    branches: [prueba/atom-noviembre-2026]
permissions:
  contents: read
jobs:
  noviembre:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Descargar noviembre (ordinarios y menores)
        shell: bash
        run: |
          set -eu
          base=https://contrataciondelsectorpublico.gob.es/sindicacion
          for item in sindicacion_643/licitacionesPerfilesContratanteCompleto3 sindicacion_1143/contratosMenoresPerfilesContratantes; do
            curl --silent --show-error --fail --location --retry 1 --max-time 900 --max-filesize 2000000000 -w 'Bytes: %{size_download}; segundos: %{time_total}\n' -o "$RUNNER_TEMP/${item##*/}.zip" "$base/${item}_202611.zip"
          done
      - name: Simular y comparar sin escribir datos
        run: python scripts/ensayo_noviembre.py "$RUNNER_TEMP/licitacionesPerfilesContratanteCompleto3.zip" "$RUNNER_TEMP/contratosMenoresPerfilesContratantes.zip"

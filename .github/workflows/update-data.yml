name: Prueba histórica ATOM agosto
on:
  push:
    branches: [prueba/atom-agosto-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agosto:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Descargar solo agosto y comparar expedientes
        run: |
          curl --fail --location --retry 2 --max-time 900 --max-filesize 2000000000 -o "$RUNNER_TEMP/agosto.zip" -w 'Bytes: %{size_download}; segundos descarga: %{time_total}\n' https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202608.zip
          python scripts/probar_atom_agosto.py "$RUNNER_TEMP/agosto.zip"

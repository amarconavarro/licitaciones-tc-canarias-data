name: Actualizar licitaciones TC

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-licitaciones-tc
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Actualizar datos oficiales
        run: python scripts/update_data.py --start-year 2025

      - name: Guardar cambios si existen
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No hay cambios de datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones-tc.json
          git commit -m "Actualizar licitaciones TC"
          git push
